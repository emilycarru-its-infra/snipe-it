name: Tests in MySQL

on:
  push:
    branches:
      - master
      - develop
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        # Match production. The app image installs PHP 8.3 and the database
        # behind it is MySQL 8.0 — testing 8.4 against 5.7 proved neither,
        # and quietly let anything 8.0 is stricter about (ONLY_FULL_GROUP_BY,
        # utf8mb4 collation defaults) through a green suite.
        #
        # The data directory is a tmpfs because none of it outlives the job,
        # and these are database-bound feature tests.
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: snipeit
        ports:
          - 33306:3306
        options: >-
          --tmpfs /var/lib/mysql
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    strategy:
      fail-fast: false
      matrix:
        php-version:
          # The version the shipped container installs, not the newest one.
          - "8.3"

    name: PHP ${{ matrix.php-version }}

    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: none

      - uses: actions/checkout@v6

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Cache vendor directory
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-${{ matrix.php-version }}-vendor-${{ hashFiles('**/composer.lock') }}

      - name: Copy .env
        run: |
          cp -v .env.testing.example .env
          cp -v .env.testing.example .env.testing

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Setup Laravel
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: snipeit
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_USERNAME: root
        run: |
          php artisan key:generate
          php artisan migrate --force
          php artisan passport:install --no-interaction
          chmod -R 777 storage bootstrap/cache

      - name: Verify schema snapshot is current (guards against recorded-but-missing drift)
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: snipeit
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_USERNAME: root
        run: |
          php artisan schema:check --dump
          git diff --exit-code database/schema/expected-columns.json \
            || { echo "::error::database/schema/expected-columns.json is stale — a migration changed the schema. Run 'php artisan schema:check --dump' and commit the result."; exit 1; }
          php artisan schema:check

      - name: Execute tests (Unit and Feature tests) via PHPUnit
        env:
          DB_CONNECTION: mysql
          DB_DATABASE: snipeit
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_USERNAME: root
          LOG_CHANNEL: single
          LOG_LEVEL: debug
        run: php artisan test --parallel --processes=4

      - name: Upload Laravel logs as artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: laravel-logs-php-${{ matrix.php-version }}-run-${{ github.run_attempt }}
          path: |
            storage/logs/*.log
          if-no-files-found: ignore
          retention-days: 7
