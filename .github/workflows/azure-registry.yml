name: Build and Push Snipe‑IT Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: inventoryacrecu.azurecr.io
  GHCR_REGISTRY: ghcr.io
  IMAGE_NAME: snipeit-custom

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v2

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # The same image also goes to GitHub Container Registry, signed in with
      # the workflow's own GITHUB_TOKEN rather than a stored password. Once the
      # deployment side mirrors from here, the registry login above and its
      # secrets can go.
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.GHCR_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short         #  <commit‑SHA>
            type=ref,event=branch         #  <branch‑name>
            type=raw,value=latest,enable={{is_default_branch}}

      # A pull request builds to prove the image still builds; it does not
      # publish. Its tags are computed from the merge commit, so nothing can
      # deploy them anyway, and pushing them only filled the registry with
      # per-PR tags nobody would ever pull.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
